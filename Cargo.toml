[package]
name = "igris-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared LAN device-ecosystem protocol core (eco + fastswap) for IGRIS desktop and mobile companions."

[lib]
name = "igris_protocol"
# cdylib -> Android .so (loaded by JNA); staticlib -> iOS; lib -> host tests + uniffi-bindgen library mode
crate-type = ["cdylib", "staticlib", "lib"]

# Phase 1: local copy of the UniFFI bindgen CLI (`cargo run --bin uniffi-bindgen -- ...`).
# The `cli` feature on the `uniffi` crate provides `uniffi::uniffi_bindgen_main()`.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# ---- async runtime + primitives ----
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# ---- serialization / data ----
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
bytes = "1.5"
sha2 = "0.10"
once_cell = "1.19"
lazy_static = "1.4"
anyhow = "1.0"
tracing = "0.1"

# ---- HTTP server (eco REST + fastswap LocalSend v2) ----
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "add-extension"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# ---- HTTP client. rustls-tls (NOT native-tls/OpenSSL); no `blocking` (Android is async) ----
reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "rustls-tls"] }

# ---- TLS: force the `ring` crypto backend on all three crates and disable their
#      aws_lc_rs defaults, so nothing pulls aws-lc-rs (cmake + NDK C toolchain) into
#      the Android cross-compile. This is the top build risk from the plan. ----
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# ---- misc (all cross-compile to aarch64-linux-android) ----
local-ip-address = "0.6"
whoami = "1.5"
mime_guess = "2.0"
rand = "0.8"

# ---- UniFFI bindings (Phase 1) ----
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Route `tracing` / `log` to logcat on Android; wired up in the ffi layer (Phase 1).
android_logger = "0.14"
log = "0.4"
tracing-log = "0.1"
